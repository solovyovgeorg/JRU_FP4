services:
    mysql:
      image: mysql:8.4
      environment:
        MYSQL_ROOT_PASSWORD: ${MYSQL_ROOT_PASSWORD}
        #Так подсказывает делать ИИ, но как будто слишком автоматизировано
        #volumes:
          #- ./mySql/dump-hibernate-final.sql:/docker-entrypoint-initdb.d/dump-hibernate-final.sql
      ports:
        - "3306:3306"
      healthcheck:
        test: [ "CMD", "mysqladmin", "ping", "-h", "localhost", "-p${MYSQL_ROOT_PASSWORD}" ]
        interval: 5s
        timeout: 5s
        retries: 10

#Вспомогательный инициализатор для контейнера mysql по healthcheck'у оного
    mysql-init:
      image: mysql:8.4

      depends_on:
        mysql:
          condition: service_healthy

      volumes:
        - ./mySql/dump-hibernate-final.sql:/init.sql

      command: >
        sh -c
        "mysql -h mysql -uroot -p${MYSQL_ROOT_PASSWORD} < /init.sql"

    redis:
      image: redis:8
      command: redis-server --requirepass ${REDIS_PASSWORD}
      ports:
        - "6379:6379"
